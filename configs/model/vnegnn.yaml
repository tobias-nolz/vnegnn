_target_: src.wrappers.bindingsites.BindingSitesWrapper
_recursive_: false
compile: true
scaling_factor: 5.0
threshold: 4
monitor: val/dcc_ranked
# Smoothing for `val/dcc_ranked_ema`, the metric used for checkpoint selection and early
# stopping (see BindingSitesWrapper.on_validation_epoch_end).
selection_metric_ema_decay: 0.3
interval: epoch
frequency: ${trainer.check_val_every_n_epoch}
cluster: null

loss:
  _target_: src.wrappers.bindingsites.BindingSitesLoss
  global_node_pos_loss:
    _target_: src.modules.losses.HuberLoss
  confidence_loss:
    _target_: src.modules.losses.ConfidenceLoss
  # Listwise ranking head on the confidence output. This term optimises the per-protein ordering directly.
  # It only moves confidence, not coordinates, so it lifts DCC0 toward the DCC7 ceiling.
  #   tau_dist: sharpness of the distance target (A); smaller -> harder one-hot on the
  #             closest node. 2.0 keeps a few near-optimal nodes as soft positives.
  #   tau_conf: softmax temperature on the predicted confidences. Set weight to 0 to
  #             disable and recover the previous behaviour exactly.
  ranking_loss:
    _target_: src.modules.losses.ConfidenceRankingLoss
    tau_dist: 2.0
    tau_conf: 0.5
  segmentation_loss:
    _target_: src.modules.losses.DiceLoss
  # Binary orthosteric(0)/allosteric(1) head. pos_weight (1-p)/p ~= 3.2 restores a balanced
  # effective prior so the 0.5 decision threshold is meaningful.
  classification_loss:
    _target_: torch.nn.BCEWithLogitsLoss
    pos_weight:
      _target_: torch.tensor
      data: [ 3.2 ]
  confidence_loss_weight: 0.1
  ranking_loss_weight: 1.0
  segmentation_loss_weight: 1.0
  classification_loss_weight: 0.5
  # Each virtual node is labelled with the site type of its nearest annotated center.
  # Only virtual nodes within this many Angstrom of a real site (foreground) contribute;
  # null supervises every virtual node.
  classification_foreground_dist: 8.0

backbone:
  _target_: src.models.vnegnn.VNEGNN
  input_features: 1301
  node_features: 100
  edge_features: 1
  hidden_features: 100
  out_features: 100
  num_layers: 5
  dropout: 0.1
  residual: true

  act:
    _target_: torch.nn.SiLU
    _partial_: true

  node_aggr:
    _target_: torch_geometric.nn.MeanAggregation
    _partial_: true

  cord_aggr:
    _target_: torch_geometric.nn.MeanAggregation
    _partial_: true

  norm_coords: true
  norm_coors_scale_init: 0.01
  norm_feats: true

  initialization_gain: 1.0
  weight_share: false

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0001

ema: null
