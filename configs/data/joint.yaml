defaults:
  - default
  - _self_

_target_: src.datasets.joint_dataset.JointBindingDataModule

# sc-PDB + benchmark datasets (coach420/holo4k/pdbbind2020) live here.
root: ${paths.data_dir}/data
# ASD dataset lives in a separate tree.
allosteric_root: ${paths.data_dir}/allosteric-sites
# sc-PDB train/valid split name. Falls back to `scpdb` when the global
# `train_valid_split` is absent (e.g. during eval, where only the test loaders are used),
# so `+data=joint` works for both `train.py` and `eval.py` without an extra override.
train_valid_split: ${oc.select:train_valid_split,scpdb}
allosteric_dataset_name: allosteric
# Suffix of the ASD split id files produced by scripts/allosteric-sites/make_splits.py,
# e.g. train_ids_allosteric_mmseqs30 / valid_ids_allosteric_mmseqs30 / test_ids_allosteric_mmseqs30.
split_suffix: mmseqs30

# Draw orthosteric (sc-PDB) and allosteric (ASD) samples at ~equal frequency during
# training so the far larger sc-PDB set does not dominate every batch. Set to false to
# train on the natural (orthosteric-heavy) mixture instead.
balance_classes: true

# How the mass inside each half is spread (only used when balance_classes is true):
#   dataset - uniform over proteins (the original scheme)
#   cluster - uniform over MMseqs sequence clusters
sampling: cluster

# mmseqs `*_cluster.tsv` used by sampling=cluster. null resolves to
# <allosteric_root>/<allosteric_dataset_name>/splits/_mmseqs/cluster_cluster.tsv, which
# make_splits.py writes covering both the ASD and the sc-PDB training sequences.
cluster_tsv: null

# Binding sites whose center is further than this (Angstrom) from any parsed residue are
# dropped at graph-build time and excluded from the benchmark.
max_center_dist: 8.0

# Reduce each multimeric ASD protein to the single chain hosting its allosteric
# pocket before graph build. The host chain is derived from the annotated modulator
# ligand's residue contacts (ground truth, never model output); symmetry-replicated pocket
# copies on other chains fall away, restoring sc-PDB-like single-chain geometry.
#   - Applies to ASD train/valid/test only; sc-PDB and coach420/holo4k/pdbbind are already
#     single-chain and untouched, so their reported numbers stay comparable to prior work.
#   - Changes the ASD denominator (proteins/sites evaluated), so post-filter ASD metrics are
#     NOT comparable to pre-filter ASD numbers
single_chain_allosteric: false

# per_site_labels: label each virtual node with the site type of its NEAREST center
#   (true, deployed). Set false for PER-PROTEIN labels: every center inherits the
#   protein's dataset class, so an ASD protein's extracted orthosteric pocket is
#   relabelled allosteric. Isolates the value of the per-site labelling scheme.
per_site_labels: true
# drop_ortho_augmentation: when true, drop the class-0 orthosteric centers harvested
#   from ASD proteins (--extract-orthosteric), reproducing the no-augmentation dataset
#   exactly (extraction adds labels, not nodes). Isolates the value of the augmentation.
drop_ortho_augmentation: false

batch_size: 8

n_jobs: 8
num_workers: 2
