defaults:
  - default
  - _self_

_target_: src.datasets.joint_dataset.JointBindingDataModule

# sc-PDB + benchmark datasets (coach420/holo4k/pdbbind2020) live here.
root: ${paths.data_dir}/data
# ASD dataset lives in a separate tree.
allosteric_root: ${paths.data_dir}/allosteric-sites
# sc-PDB train/valid split name. Falls back to `scpdb` when the global
# `train_valid_split` is absent (e.g. during eval, where only the test loaders are used),
# so `+data=joint` works for both `train.py` and `eval.py` without an extra override.
train_valid_split: ${oc.select:train_valid_split,scpdb}
allosteric_dataset_name: allosteric
# Suffix of the ASD split id files produced by scripts/allosteric-sites/make_splits.py,
# e.g. train_ids_allosteric_mmseqs30 / valid_ids_allosteric_mmseqs30 / test_ids_allosteric_mmseqs30.
split_suffix: mmseqs30

# Draw orthosteric (sc-PDB) and allosteric (ASD) samples at ~equal frequency during
# training so the far larger sc-PDB set does not dominate every batch. Set to false to
# train on the natural (orthosteric-heavy) mixture instead.
balance_classes: true

batch_size: 16

n_jobs: 8
num_workers: 2
