# @package _global_

# Joint orthosteric (sc-PDB) + allosteric (ASD) training with the classification head.
# Run with: python src/train.py experiment=vnegnn_joint

defaults:
  - override /data: joint
  - override /model: vnegnn
  - override /paths: default

train_valid_split: scpdb

logger:
  wandb:
    name: joint_${train_valid_split}
    project: vnegnn

tags: ["joint", "allosteric"]

callbacks:
  model_checkpoint:
    monitor: val/dcc_ranked_ema
  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: val/dcc_ranked_ema
    mode: max
    patience: 12
    min_delta: 0.0
    check_finite: true
    verbose: true

trainer:
  max_epochs: 400
  num_sanity_val_steps: 0
  log_every_n_steps: 15
  check_val_every_n_epoch: 5
  precision: bf16-mixed
  # Effective batch = data.batch_size (8, configs/data/joint.yaml) * accumulate_grad_batches (4) = 32
  accumulate_grad_batches: 4

scaling_factor: 5.0

# Train-only virtual-node radius augmentation.
data:
  sample_radius: true
