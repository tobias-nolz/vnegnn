# @package _global_

# Joint orthosteric (sc-PDB) + allosteric (ASD) training with the classification head.
# Run with: python src/train.py experiment=vnegnn_joint

defaults:
  - override /data: joint
  - override /model: vnegnn
  - override /paths: default

train_valid_split: scpdb

logger:
  wandb:
    name: joint_${train_valid_split}
    project: vnegnn

tags: ["joint", "allosteric"]

# The primary goal is reliable allosteric localization, and the joint val set is
# orthosteric-heavy, so select the checkpoint on allosteric ranked DCC rather than the
# pooled val/dcc_ranked. Switch to val/dcc_ranked (pooled) or val/dcc_ranked_ortho if you
# want to weight orthosteric retention more.
callbacks:
  model_checkpoint:
    monitor: val/dcc_ranked_allo

trainer:
  max_epochs: 1500
  num_sanity_val_steps: 0
  log_every_n_steps: 15
  check_val_every_n_epoch: 5
  # bf16 mixed precision: ~half the activation memory and faster, with
  # fp32-equivalent dynamic range (no loss scaling / overflow risk). Weights and optimizer
  # state stay fp32. Sanity-check val/dcc_ranked_* early since the model does E(3)-equivariant
  # coordinate math
  precision: bf16-mixed
  # Effective batch = data.batch_size (8) * accumulate_grad_batches (4) = 32, matching the
  # upstream VN-EGNN batch size that lr=1e-4 was tuned for.
  accumulate_grad_batches: 4

scaling_factor: 5.0
